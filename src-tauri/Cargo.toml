[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", default-features = false, features = ["wry"] }
tauri-plugin-log = "2"
chrono = { version = "0.4", features = ["serde"] }
notify = "6.1"
sysinfo = "0.36.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.dev]
opt-level = "s"
debug = 0
codegen-units = 1
# panic="abort" removed: it disabled unwinding, so the catch_unwind guard in
# android_bridge::with_android_context could not catch the "android context not
# initialized" panic, turning a recoverable error into a fatal SIGABRT crash on launch.
incremental = false

[profile.release]
debug = 0
strip = true
